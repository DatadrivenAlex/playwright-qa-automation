name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: python -m ruff check .

      - name: API suite
        id: api
        run: python -m pytest -m api -n 2 --html=reports/api-report.html --self-contained-html

      - name: UI suite
        id: ui
        if: always()
        run: python -m pytest -m ui -n 2 --html=reports/ui-report.html --self-contained-html

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Require both suites to pass
        if: always()
        run: |
          test "${{ steps.api.outcome }}" = "success"
          test "${{ steps.ui.outcome }}" = "success"
