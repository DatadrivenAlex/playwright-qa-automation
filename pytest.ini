[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --screenshot=only-on-failure
    --full-page-screenshot
    --tracing=retain-on-failure
    --output=reports/playwright
    --alluredir=reports/allure-results
markers =
    smoke: Critical path. Safe to run on every change.
    regression: Broader suite. Every test in this project carries this marker.
    api: HTTP tests that talk to the demo shop with httpx.
    ui: Browser tests that use Playwright's sync API.
