{% extends "base.html" %}
{% block content %}
<section class="login-layout">
  <div class="login-copy">
    <p class="eyebrow">Members</p>
    <h1>Sign in</h1>
    <p>The catalog is open. Signing in keeps a cart and lets you check out.</p>
  </div>
  <form class="card form" method="post" action="/login{% if request.query_params.get('next') %}?next={{ request.query_params.get('next') }}{% endif %}">
    {% if error %}
      <p class="flash flash-err" data-testid="login-error" role="alert">{{ error }}</p>
    {% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" value="{{ username }}" data-testid="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" data-testid="password">
    <button type="submit" data-testid="login-submit">Sign in</button>
    <p class="hint">Demo account <strong>alex</strong> / <strong>demo123</strong></p>
  </form>
</section>
{% endblock %}
